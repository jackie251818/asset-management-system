# ============================================================
#  固定资产管理系统 - nginx 反向代理配置 (Windows)
#
#  部署拓扑: 浏览器/桌面客户端 → nginx(80/443) → asset-server.exe(127.0.0.1:3456)
#  放置位置: deploy/nginx/conf/nginx.conf (本文件由 install 前复制或直接使用)
#  证书:     deploy/cert/server.crt + server.key (由 make-cert.ps1 生成)
# ============================================================

worker_processes  1;
error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout  65;

    # 附件 base64 / Excel 批量导入, 与服务端 BODY_LIMIT 保持一致
    client_max_body_size 64m;

    # 响应压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- HTTP (80): 局域网明文访问 ----------
    server {
        listen       80;
        server_name  _;

        location / {
            proxy_pass         http://127.0.0.1:3456;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }

    # ---------- HTTPS (443): 自签证书, 客户端需信任或忽略告警 ----------
    server {
        listen       443 ssl;
        server_name  _;

        # 相对路径基于 conf/ 目录: conf/../../cert = deploy/cert (make-cert.ps1 生成)
        ssl_certificate      ../../cert/server.crt;
        ssl_certificate_key  ../../cert/server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;

        location / {
            proxy_pass         http://127.0.0.1:3456;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
